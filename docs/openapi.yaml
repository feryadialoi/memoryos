openapi: 3.1.0
info:
  title: MemoryOS API
  version: 0.1.0
servers:
  - url: http://localhost:6366
security:
  - bearer: []
paths:
  /healthz:
    get:
      summary: Liveness
      security: []
      responses:
        "200": { description: Process is up }
  /readyz:
    get:
      summary: Readiness, checks the database and that the local model has loaded
      security: []
      responses:
        "200": { description: Ready }
        "503": { description: "Not ready: the database is unavailable, or the local embedding model is still loading or failed to load. The body also reports the reranker (loading, ready, failed or off), which never makes the server not ready, and reranker_model, the model it uses or null when off" }
  /metrics:
    get:
      summary: Prometheus metrics
      security: []
      responses:
        "200": { description: Metrics text }
  /v1/episodes/{id}:
    get:
      summary: Read the source of a commit. processed_at is set once its facts are applied
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Episode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Episode" }
        default: { $ref: "#/components/responses/Error" }
  /v1/episodes/{id}/purge:
    post:
      summary: Delete an episode and facts derived only from it. Admin only
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Purged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgeReport" }
        default: { $ref: "#/components/responses/Error" }
  /v1/recall:
    post:
      summary: Hybrid search over facts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecallRequest" }
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecallResponse" }
        default: { $ref: "#/components/responses/Error" }
  /v1/candidates:
    post:
      summary: Related current facts, so the host can decide whether a statement adds, replaces or repeats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes, statement]
              properties:
                scopes: { type: array, items: { type: string }, maxItems: 50 }
                statement: { type: string }
                limit: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                type: object
                required: [facts]
                properties:
                  facts:
                    type: array
                    items:
                      type: object
                      required: [fact, score]
                      properties:
                        fact: { $ref: "#/components/schemas/Fact" }
                        score: { type: number }
        default: { $ref: "#/components/responses/Error" }
  /v1/commits:
    post:
      summary: Store facts decided by the host. Trust is at most agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommitRequest" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [episode_id, facts, redacted]
                properties:
                  episode_id: { type: string, format: uuid }
                  redacted:
                    type: boolean
                    description: >-
                      True when a secret (an API key, token, private key, JWT or a value labelled
                      password, secret, token or api_key) in content, a statement or an entity
                      name was replaced by [redacted] before it was stored
                  facts:
                    type: array
                    items:
                      type: object
                      required: [id, status]
                      properties:
                        id: { type: string, format: uuid }
                        status: { type: string, enum: [active, quarantined, rejected] }
                        corroborated:
                          type: boolean
                          default: false
                          description: >-
                            No fact was created. id is an existing current fact that gained this
                            source, named by corroborates or matched because a fact that does
                            not set corroborates has the same statement, ignoring case,
                            whitespace runs and a final period. Omitted when false
                        superseded:
                          type: string
                          format: uuid
                          description: >-
                            Set with corroborated when the request fact named this id in
                            supersedes and a current fact already held its statement: no fact
                            was created, and id became the successor of the superseded fact.
                            Also set on a created fact whose predicate is single-valued (such as
                            lives_in or works_at, see MEMORYOS_SINGLE_VALUED_PREDICATES) to the
                            current fact of the same subject and predicate that it replaced:
                            closed now when status is active, and when approved when it is
                            quarantined. Omitted otherwise, and on an idempotency replay
                        related:
                          type: array
                          maxItems: 3
                          description: >-
                            For a created fact, up to three current facts of the same scope that
                            were candidates but not repeats, best first. Omitted when empty, and
                            always empty on an idempotency replay
                          items:
                            type: object
                            required: [id, statement, score]
                            properties:
                              id: { type: string, format: uuid }
                              statement: { type: string }
                              score: { type: number }
        default: { $ref: "#/components/responses/Error" }
  /v1/scopes:
    get:
      summary: The scopes this key may read, with counts, most recently written first
      responses:
        "200":
          description: >-
            Scopes. `quarantined` is 0 for a key that is not an admin. `truncated` is true when more
            than 500 scopes exist and the rest were left out
          content:
            application/json:
              schema:
                type: object
                required: [scopes, truncated]
                properties:
                  scopes: { type: array, items: { $ref: "#/components/schemas/ScopeSummary" } }
                  truncated: { type: boolean }
        default: { $ref: "#/components/responses/Error" }
  /v1/facts:
    get:
      summary: List active facts of one scope, newest recorded first
      parameters:
        - name: scope
          in: query
          required: true
          description: An exact scope the key allows
          schema: { type: string }
        - name: state
          in: query
          description: >-
            `current` is what recall can return now. `past` is closed, retracted or starting later.
            Quarantined and rejected facts are never listed here
          schema: { type: string, enum: [current, past, all], default: current }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: before
          in: query
          description: The last id of the previous page
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Facts
          content:
            application/json:
              schema:
                type: object
                required: [facts]
                properties:
                  facts: { type: array, items: { $ref: "#/components/schemas/FactView" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/facts/{id}:
    get:
      summary: Read a fact
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Fact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fact" }
        default: { $ref: "#/components/responses/Error" }
  /v1/facts/{id}/history:
    get:
      summary: All versions in the fact's supersession chain, oldest first
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: object
                required: [facts]
                properties:
                  facts: { type: array, items: { $ref: "#/components/schemas/Fact" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/facts/{id}/invalidate:
    post:
      summary: Retract a fact as wrong
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Updated fact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fact" }
        default: { $ref: "#/components/responses/Error" }
  /v1/entities/{id}:
    get:
      summary: Read an entity
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Entity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entity" }
        default: { $ref: "#/components/responses/Error" }
  /v1/entities/{id}/neighbors:
    get:
      summary: Graph neighborhood of an entity
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: scopes
          in: query
          required: true
          description: Comma-separated scopes
          schema: { type: string }
        - name: depth
          in: query
          schema: { type: integer, minimum: 1, maximum: 5, default: 1 }
        - name: as_of
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Neighborhood
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphNeighborhood" }
        default: { $ref: "#/components/responses/Error" }
  /v1/quarantine:
    get:
      summary: List quarantined facts. Admin only
      parameters:
        - name: scopes
          in: query
          required: true
          description: >-
            Comma-separated scopes or patterns, in the form of the key's patterns: `*`, `user:*` or
            `user:prefix*`. An exact scope the key does not allow is 403. A pattern returns only
            facts in scopes the key allows, and is 403 when it can match none of them
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Facts
          content:
            application/json:
              schema:
                type: object
                required: [facts]
                properties:
                  facts: { type: array, items: { $ref: "#/components/schemas/Fact" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/quarantine/{id}/approve:
    post:
      summary: Activate a quarantined fact. Admin only
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Updated fact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fact" }
        default: { $ref: "#/components/responses/Error" }
  /v1/quarantine/{id}/reject:
    post:
      summary: Reject a quarantined fact. Admin only
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Updated fact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fact" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agents/{agent_id}/blocks:
    get:
      summary: List an agent's blocks
      parameters: [{ $ref: "#/components/parameters/AgentId" }]
      responses:
        "200":
          description: Blocks
          content:
            application/json:
              schema:
                type: object
                required: [blocks]
                properties:
                  blocks: { type: array, items: { $ref: "#/components/schemas/Block" } }
        default: { $ref: "#/components/responses/Error" }
  /v1/agents/{agent_id}/blocks/{label}:
    get:
      summary: Read a block
      parameters:
        - { $ref: "#/components/parameters/AgentId" }
        - { $ref: "#/components/parameters/Label" }
      responses:
        "200":
          description: Block
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Block" }
        default: { $ref: "#/components/responses/Error" }
    put:
      summary: Create a block, or update it when expected_version matches
      parameters:
        - { $ref: "#/components/parameters/AgentId" }
        - { $ref: "#/components/parameters/Label" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                max_chars: { type: integer, default: 2000, maximum: 100000 }
                expected_version:
                  type: [integer, "null"]
                  description: Omit or null to create. Otherwise the version being replaced
      responses:
        "200":
          description: Updated block
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Block" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agents/{agent_id}/blocks/{label}/versions:
    get:
      summary: Block edit history, the latest 100 versions, oldest first
      parameters:
        - { $ref: "#/components/parameters/AgentId" }
        - { $ref: "#/components/parameters/Label" }
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      type: object
                      required: [version, content, edited_by, edited_at]
                      properties:
                        version: { type: integer }
                        content: { type: string }
                        edited_by: { type: string }
                        edited_at: { type: string, format: date-time }
        default: { $ref: "#/components/responses/Error" }
  /v1/users/{user_id}/memory:
    delete:
      summary: Hard-delete everything under scope user:{user_id}. Admin only
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgeReport" }
        default: { $ref: "#/components/responses/Error" }
  /mcp:
    post:
      summary: MCP Streamable HTTP endpoint. Tools recall_candidates, commit_facts, recall, block_read, block_replace, graph_neighbors
      responses:
        "200": { description: JSON-RPC response }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentId:
      name: agent_id
      in: path
      required: true
      schema: { type: string }
    Label:
      name: label
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
  schemas:
    Trust: { type: string, enum: [external, agent, user, system] }
    EntityRef:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string }
    CommitRequest:
      type: object
      required: [scope, source, content, facts]
      properties:
        scope: { type: string }
        source: { type: string }
        content: { type: string, maxLength: 100000, description: Source text kept for provenance }
        idempotency_key: { type: [string, "null"] }
        facts:
          type: array
          maxItems: 50
          items:
            type: object
            required: [statement, subject, predicate]
            properties:
              statement: { type: string }
              subject: { $ref: "#/components/schemas/EntityRef" }
              predicate: { type: string }
              object: { oneOf: [{ $ref: "#/components/schemas/EntityRef" }, { type: "null" }] }
              valid_from: { type: [string, "null"], format: date-time }
              expires_at:
                type: [string, "null"]
                format: date-time
                description: >-
                  When the fact stops being true with nothing replacing it, such as the end of a
                  leave. Must be after valid_from. From then on it is not current: recall,
                  candidates and matching skip it, and it stays in history and in state=past
              supersedes: { type: [string, "null"], format: uuid }
              corroborates: { type: [string, "null"], format: uuid }
    Episode:
      type: object
      required: [id, scope, source, trust, content, metadata, occurred_at, created_at]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string }
        source: { type: string }
        trust: { $ref: "#/components/schemas/Trust" }
        content: { type: string }
        metadata: { type: object }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        processed_at: { type: [string, "null"], format: date-time }
    Entity:
      type: object
      required: [id, scope, kind, name, aliases]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string }
        kind: { type: string }
        name: { type: string }
        aliases: { type: array, items: { type: string } }
    Fact:
      type: object
      required: [id, scope, subject_id, predicate, statement, trust, status, valid_from, recorded_at, source_episode_ids]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string }
        subject_id: { type: string, format: uuid }
        predicate: { type: string }
        object_id: { type: [string, "null"], format: uuid }
        statement: { type: string }
        trust: { $ref: "#/components/schemas/Trust" }
        status: { type: string, enum: [active, quarantined, rejected] }
        valid_from: { type: string, format: date-time }
        valid_to: { type: [string, "null"], format: date-time }
        expires_at:
          type: [string, "null"]
          format: date-time
          description: The commit's own end of the fact. The fact is not current from this time
        recorded_at: { type: string, format: date-time }
        invalidated_at: { type: [string, "null"], format: date-time }
        superseded_by: { type: [string, "null"], format: uuid }
        pending_supersede_of: { type: [string, "null"], format: uuid }
        source_episode_ids: { type: array, items: { type: string, format: uuid } }
    FactView:
      allOf:
        - $ref: "#/components/schemas/Fact"
        - type: object
          required: [subject_name, subject_kind]
          properties:
            subject_name: { type: string }
            subject_kind: { type: string }
            object_name: { type: [string, "null"] }
            object_kind: { type: [string, "null"] }
    ScopeSummary:
      type: object
      required: [scope, current, past, quarantined, entities, blocks]
      properties:
        scope: { type: string }
        current: { type: integer }
        past: { type: integer }
        quarantined: { type: integer }
        entities: { type: integer }
        blocks: { type: integer }
        last_recorded_at: { type: [string, "null"], format: date-time }
    RecallRequest:
      type: object
      required: [scopes, query]
      properties:
        scopes: { type: array, items: { type: string }, maxItems: 50 }
        query: { type: string }
        limit: { type: integer, minimum: 1, maximum: 100, default: 10 }
        as_of: { type: [string, "null"], format: date-time }
        known_at: { type: [string, "null"], format: date-time }
    RecallResponse:
      type: object
      required: [facts]
      properties:
        facts:
          type: array
          items:
            type: object
            required: [fact, score]
            properties:
              fact: { $ref: "#/components/schemas/Fact" }
              score: { type: number }
    GraphNeighborhood:
      type: object
      required: [root, entities, edges]
      properties:
        root: { type: string, format: uuid }
        entities: { type: array, items: { $ref: "#/components/schemas/Entity" } }
        edges: { type: array, items: { $ref: "#/components/schemas/Fact" } }
    Block:
      type: object
      required: [id, agent_id, label, content, max_chars, version, updated_at]
      properties:
        id: { type: string, format: uuid }
        agent_id: { type: string }
        label: { type: string }
        content: { type: string }
        max_chars: { type: integer }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
    PurgeReport:
      type: object
      required: [facts_deleted, episodes_deleted, entities_deleted]
      properties:
        facts_deleted: { type: integer }
        episodes_deleted: { type: integer }
        entities_deleted: { type: integer }
