name: Deploy

# Every merge to main builds the server image into GHCR, then updates the VPS over SSH: the checkout
# in ~/memoryos moves to the merged commit and Compose pulls that image, migrates and restarts.
# One-time VPS setup is in docs/vps-deployment.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/feryadialoi/memoryos

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Update the VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          SHA: ${{ github.sha }}
          # Valid only while this job runs, so the VPS stores no registry credential.
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SHA,GHCR_TOKEN,GHCR_USER
          command_timeout: 25m
          script: |
            set -eu
            cd ~/memoryos
            git fetch --quiet origin main
            git checkout --quiet --detach "$SHA"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export MEMORYOS_IMAGE="ghcr.io/feryadialoi/memoryos:$SHA"
            compose="docker compose -f deploy/docker-compose.yml"
            $compose pull migrate memoryos
            # The first start downloads the models, so wait up to 20 minutes for /readyz.
            # Waits on the server only: the one-shot migrate service exits by design.
            $compose up -d --no-build --remove-orphans --wait --wait-timeout 1200 memoryos
            docker logout ghcr.io
            docker image prune -f
