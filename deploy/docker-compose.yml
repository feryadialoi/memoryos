# `memoryos setup` runs this file for you, from a copy under your config directory.
# By hand: docker compose -f deploy/docker-compose.yml up -d --build
# Upgrades, backups and incidents are in docs/runbook.md.

name: memoryos

x-image: &image
  image: ${MEMORYOS_IMAGE:-memoryos:local}
  build:
    # `memoryos setup` points this at the checkout, because its copy of this file is elsewhere.
    context: ${MEMORYOS_BUILD_CONTEXT:-..}
    dockerfile: Dockerfile

# `:?` stops Compose with this message when the password is unset. No password lives in this file.
x-database-url: &database-url postgres://memoryos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env, see deploy/.env.example}@postgres:5432/memoryos

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    # Not published on the host. Reach it with `docker compose exec postgres psql -U memoryos`.
    environment:
      POSTGRES_USER: memoryos
      POSTGRES_DB: memoryos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env, see deploy/.env.example}
    volumes:
      # A named volume by default. `memoryos setup` sets a directory under your config directory.
      - ${MEMORYOS_PGDATA:-pgdata}:/var/lib/postgresql/data
    stop_grace_period: 60s
    healthcheck:
      test: [CMD-SHELL, pg_isready -U memoryos -d memoryos]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # Runs on every `up`, and is a no-op when the schema is current.
  migrate:
    <<: *image
    command: [migrate]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: *database-url
    healthcheck:
      disable: true

  # No LLM key. The agent's own model extracts facts and sends them to /v1/commits.
  memoryos:
    <<: *image
    command: [serve]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The embedding model and the reranking model together, see docs/runbook.md.
    mem_limit: ${MEMORYOS_MEM_LIMIT:-2560m}
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - ${MEMORYOS_PUBLISH:-127.0.0.1:6366}:6366
    volumes:
      - model-cache:/var/lib/memoryos/models
    environment:
      DATABASE_URL: *database-url
      # Spelled out because an empty RUST_LOG would silence everything below errors.
      RUST_LOG: ${RUST_LOG:-info,opentelemetry=warn,opentelemetry_sdk=warn,hyper=warn}
      MEMORYOS_RATE_LIMIT_RPS: ${MEMORYOS_RATE_LIMIT_RPS:-}
      MEMORYOS_DB_MAX_CONNECTIONS: ${MEMORYOS_DB_MAX_CONNECTIONS:-}
      MEMORYOS_REQUEST_TIMEOUT_SECS: ${MEMORYOS_REQUEST_TIMEOUT_SECS:-}
      MEMORYOS_RERANKER: ${MEMORYOS_RERANKER:-}
      MEMORYOS_RERANK_MODEL: ${MEMORYOS_RERANK_MODEL:-}
      MEMORYOS_RERANK_TOP: ${MEMORYOS_RERANK_TOP:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    # /readyz fails until the embedding model has loaded, up to 15 minutes on a first start. The
    # reranking model loads after it and does not hold readiness back.
    healthcheck:
      test: [CMD, /usr/local/bin/memoryos-healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15m
      start_interval: 5s

volumes:
  pgdata:
  model-cache:
